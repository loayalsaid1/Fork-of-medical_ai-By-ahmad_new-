<div class="card shadow-sm border-0" style="border-radius: 16px; background: #ffffff;">
  <div class="card-body p-3">
    <div class="fw-bold mb-3" style="color: #1e293b; font-size: 1rem;">Add New Task</div>
    <form
      hx-post="{% url 'web_planner_create' %}"
      hx-target="#planner-tasks"
      hx-swap="innerHTML"
      hx-include="#date-filter"
      class="vstack gap-2">
      <div>
        <label class="form-label small fw-semibold text-muted mb-1">Task Title</label>
        <input type="text" name="title" class="form-control" placeholder="Enter task description" required>
      </div>
      <div>
        <label class="form-label small fw-semibold text-muted mb-1">Due Date</label>
        <input type="date" name="due_date" class="form-control" value="{% now 'Y-m-d' %}" required>
      </div>
      <button class="btn btn-primary w-100" type="submit">
        <span class="spinner-border spinner-border-sm me-1 htmx-indicator" role="status"></span>
        Add Task
      </button>
    </form>
  </div>
</div>
