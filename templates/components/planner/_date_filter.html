{# templates/components/planner/_date_filter.html #}
<div class="card shadow-sm border-0 mb-3" style="border-radius: 16px; background: #ffffff;">
  <div class="card-body p-3">
    <div class="fw-bold mb-3" style="color: #1e293b; font-size: 1rem;">Filter Tasks</div>
    
    <div class="mb-3">
      <label class="form-label small fw-semibold text-muted mb-2">Select Date</label>
      <input 
        type="date" 
        id="date-filter" 
        class="form-control"
        hx-get="{% url 'web_planner_tasks' %}"
        hx-target="#planner-tasks"
        hx-swap="innerHTML"
        hx-trigger="change"
        hx-include="#date-filter"
        name="date"
        placeholder="Select a date">
    </div>

    <div class="d-flex gap-2">
      <button 
        class="btn btn-outline-secondary btn-sm flex-grow-1"
        hx-get="{% url 'web_planner_tasks' %}"
        hx-target="#planner-tasks"
        hx-swap="innerHTML"
        onclick="document.getElementById('date-filter').value=''">
        Show All
      </button>
      <button 
        class="btn btn-outline-primary btn-sm flex-grow-1"
        onclick="document.getElementById('date-filter').valueAsDate=new Date(); document.getElementById('date-filter').dispatchEvent(new Event('change'));">
        Today
      </button>
    </div>

    <div class="mt-2">
      <div class="small text-muted text-center">📅 Pick any date to filter tasks</div>
    </div>
  </div>
</div>
