{# expects: semesters #}
<div class="list-group fc-list">
  {% if semesters %}
    {% for s in semesters %}
      <button
        class="list-group-item list-group-item-action d-flex justify-content-between align-items-center"
        hx-get="{% url 'fc_nav_modules' %}?semester_id={{ s.id }}&semester_name={{ s.name|urlencode }}"
        hx-target="#fc-nav"
        hx-swap="innerHTML"
        hx-indicator="#fc-nav-loading">
        <span>{{ s.name }}</span>
        <span class="fc-badge">›</span>
      </button>
    {% endfor %}
  {% else %}
    <div class="fc-empty" style="padding: 2rem 1rem;">
      <div style="font-size: 2rem; opacity: 0.3; margin-bottom: 0.5rem;">📚</div>
      <div class="small text-muted">No semesters available</div>
    </div>
  {% endif %}
</div>
