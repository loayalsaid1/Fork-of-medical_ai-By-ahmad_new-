{# expects: modules, semester_name (optional) #}
<div class="mb-3">
  <a class="fc-back-btn"
     hx-get="{% url 'fc_nav_semesters' %}"
     hx-target="#fc-nav"
     hx-swap="innerHTML">
    ← Back
  </a>
</div>

<div class="list-group fc-list">
  {% if modules %}
    {% for m in modules %}
      <button
        class="list-group-item list-group-item-action d-flex justify-content-between align-items-center"
        hx-get="{% url 'fc_panel_subjects' %}?module_id={{ m.id }}&module_name={{ m.name|urlencode }}&semester_name={{ request.GET.semester_name|default:''|urlencode }}"
        hx-target="#fc-main-panel"
        hx-swap="innerHTML"
        hx-indicator="#fc-main-spin">
        <span>{{ m.name }}</span>
        <span class="fc-badge">›</span>
      </button>
    {% endfor %}
  {% else %}
    <div class="fc-empty" style="padding: 2rem 1rem;">
      <div style="font-size: 2rem; opacity: 0.3; margin-bottom: 0.5rem;">📦</div>
      <div class="small text-muted">No modules in this semester</div>
    </div>
  {% endif %}
</div>
